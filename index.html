<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buckshot Roulette</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fade-in {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in {
            animation: fade-in 0.3s ease-out forwards;
        }
        body {
            font-family: monospace;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="bg-gray-900">
    <div id="root"></div>

    <script>
        // --- START OF INLINED SCRIPT ---

        // =================================================================
        // 1. CONSTANTS & ICONS
        // =================================================================
        const INITIAL_HP = 3;
        const ALL_ITEMS = [
            { type: 'magnifyingGlass', name: 'Magnifying Glass', description: 'Reveal the next shell.' },
            { type: 'handSaw', name: 'Hand Saw', description: 'Next live shell deals 2 damage.' },
            { type: 'beer', name: 'Beer', description: 'Eject the current shell.' },
            { type: 'handcuffs', name: 'Handcuffs', description: 'The dealer skips their next turn.' },
            { type: 'cigarettes', name: 'Cigarettes', description: 'Restore 1 HP.' },
        ];

        const HeartIcon = (className = '') => `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="${className}">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>`;

        const SkullIcon = (className = '') => `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="${className}">
                 <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-2-9c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm4 0c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm-2 5c-1.66 0-3-1.34-3-3h6c0 1.66-1.34 3-3 3z"/>
            </svg>`;

        const ShellIcon = ({ type, isFired = false }) => {
            const colors = { live: 'bg-red-600 border-red-400', blank: 'bg-blue-600 border-blue-400', unknown: 'bg-gray-600 border-gray-400 text-gray-300' };
            const text = { live: 'L', blank: 'B', unknown: '?' };
            const firedClasses = isFired ? 'opacity-40 scale-90' : '';
            return `
                <div class="w-7 h-10 md:w-8 md:h-12 rounded-md border-2 flex items-center justify-center font-bold text-base md:text-lg text-white transition-all duration-300 ${colors[type]} ${firedClasses}">
                    ${text[type]}
                </div>`;
        };
        
        // =================================================================
        // 2. GAME STATE & LOGIC
        // =================================================================
        
        let state = {};
        
        function resetState() {
             state = {
                round: 1,
                playerHP: INITIAL_HP,
                dealerHP: INITIAL_HP,
                shells: [],
                currentShellIndex: 0,
                playerInventory: [],
                dealerInventory: [],
                currentPlayer: 'player',
                playerHandcuffed: 0,
                dealerHandcuffed: 0,
                sawActive: false,
                logs: [],
                winner: null,
                initialShellCounts: { live: 0, blank: 0 },
                dealerActionMessage: null,
                itemToConfirm: null,
                gameMode: 'testing',
                lastActionMessage: { message: 'Game starting...', type: 'game' },
            };
        }

        function addLog(message, type) {
            if (state.gameMode === 'live') return;
            state.logs.unshift({ id: Date.now() + Math.random(), message, type });
        }

        function setLastAction(message, type) {
            state.lastActionMessage = { message, type };
        }

        function startNewRound(currentRound) {
            const loadouts = [
                { total: 3, live: 1 }, // R1
                { total: 5, live: 2 }, // R2
                { total: 6, live: 3 }, // R3
                { total: 8, live: 4 }, // R4+
            ];
            const loadout = loadouts[Math.min(currentRound - 1, loadouts.length - 1)];
            let liveCount = loadout.live + (Math.random() > 0.5 ? 1 : 0);
            if (liveCount >= loadout.total) liveCount = loadout.total - 1;
            if (liveCount <= 0) liveCount = 1;
            const blankCount = loadout.total - liveCount;

            state.shells = [
              ...Array(liveCount).fill('live'),
              ...Array(blankCount).fill('blank')
            ]
            .sort(() => Math.random() - 0.5)
            .map((type, i) => ({ id: i, type, isRevealed: false }));
          
            state.currentShellIndex = 0;
            state.sawActive = false;
            state.dealerActionMessage = null;
            state.initialShellCounts = { live: liveCount, blank: blankCount };
          
            const generateItems = (count) => Array.from({ length: count }, (_, i) => {
                const itemProto = ALL_ITEMS[Math.floor(Math.random() * ALL_ITEMS.length)];
                return { ...itemProto, id: Date.now() + i + Math.random() };
            });
            
            let itemsToGive = 0;
            if (currentRound === 2) itemsToGive = 2;
            if (currentRound >= 3) itemsToGive = 4;

            state.playerInventory = currentRound > 1 ? generateItems(itemsToGive) : [];
            state.dealerInventory = currentRound > 1 ? generateItems(itemsToGive) : [];
            
            addLog(`--- Round ${state.round} ---`, 'game');
            addLog(`${liveCount} live, ${blankCount} blank shells loaded.`, 'game');
            setLastAction(`Round ${state.round} | ${liveCount} Live, ${blankCount} Blank`, 'game');
        }

        function checkWinner() {
            if (state.winner) return;
            if (state.playerHP <= 0) {
                state.winner = 'dealer';
            } else if (state.dealerHP <= 0) {
                state.winner = 'player';
            }
        }

        function advanceTurn(keepTurnPlayer) {
            if (state.winner) return;
          
            if (keepTurnPlayer) {
              addLog(`${keepTurnPlayer === 'player' ? 'You get' : 'The dealer gets'} another turn.`, 'game');
              setLastAction(`${keepTurnPlayer === 'player' ? 'You get' : 'Dealer gets'} another turn.`, keepTurnPlayer);
              render();
              checkForDealerTurn();
              return;
            }
          
            let nextPlayer = state.currentPlayer === 'player' ? 'dealer' : 'player';
          
            if (nextPlayer === 'player' && state.playerHandcuffed > 0) {
              state.playerHandcuffed--;
              addLog("Your turn is skipped (handcuffed).", 'player');
              setLastAction("Your turn skipped (Handcuffed)", 'player');
              nextPlayer = 'dealer';
            } else if (nextPlayer === 'dealer' && state.dealerHandcuffed > 0) {
              state.dealerHandcuffed--;
              addLog("Dealer's turn is skipped (handcuffed).", 'dealer');
              setLastAction("Dealer's turn skipped (Handcuffed)", 'dealer');
              nextPlayer = 'player';
            }
          
            state.currentPlayer = nextPlayer;
            render();
            checkForDealerTurn();
        }

        function processShot(shooter, target) {
            const shell = state.shells[state.currentShellIndex];
            if (!shell) return;

            const damage = state.sawActive && shell.type === 'live' ? 2 : 1;
            const isShooterPlayer = shooter === 'player';
            const pronoun = isShooterPlayer ? 'You' : 'The dealer';
            const targetName = target === shooter ? 'themselves' : (isShooterPlayer ? 'the dealer' : 'you');
            
            let keepTurn = false;
            
            if (shell.type === 'live') {
              addLog(`${pronoun} shoot ${targetName}. It's a LIVE shell!`, shooter);
              setLastAction(`${pronoun} shot ${targetName}: LIVE!`, shooter);
              if (target === 'player') state.playerHP = Math.max(0, state.playerHP - damage);
              else state.dealerHP = Math.max(0, state.dealerHP - damage);
            } else {
              addLog(`${pronoun} shoot ${targetName}. It's a BLANK shell.`, shooter);
              setLastAction(`${pronoun} shot ${targetName}: BLANK.`, shooter);
              if (target === shooter) keepTurn = true;
            }

            state.sawActive = false;
            checkWinner();
            render();

            const nextShellIndex = state.currentShellIndex + 1;
            if (nextShellIndex >= state.shells.length) {
                setTimeout(() => {
                    state.round++;
                    addLog("Gun is empty. Reloading...", 'game');
                    setLastAction("Gun is empty. Reloading...", 'game');
                    startNewRound(state.round);
                    state.currentPlayer = 'player';
                    render();
                    checkForDealerTurn();
                }, 1500);
            } else {
              state.currentShellIndex = nextShellIndex;
              setTimeout(() => advanceTurn(keepTurn ? shooter : undefined), 1000);
            }
        }
        
        function performDealerAction() {
            if (state.winner || state.currentPlayer !== 'dealer') return;
            state.dealerActionMessage = 'Dealer is thinking...';
            render();

            setTimeout(() => {
                const currentShell = state.shells[state.currentShellIndex];
                if (!currentShell) {
                    state.dealerActionMessage = null;
                    render();
                    return;
                }

                const firedShells = state.shells.slice(0, state.currentShellIndex);
                const firedLive = firedShells.filter(s => s.type === 'live').length;
                const firedBlank = firedShells.filter(s => s.type === 'blank').length;
                const remainingLive = state.initialShellCounts.live - firedLive;
                const remainingBlank = state.initialShellCounts.blank - firedBlank;
                const remainingTotal = remainingLive + remainingBlank;
                
                const useItem = (item) => {
                    state.dealerActionMessage = `Dealer uses ${item.name}.`;
                    render();
                    setTimeout(() => {
                        addLog(`Dealer uses ${item.name}.`, 'dealer');
                        setLastAction(`Dealer used ${item.name}`, 'dealer');
                        state.dealerInventory = state.dealerInventory.filter(i => i.id !== item.id);

                        switch (item.type) {
                          case 'cigarettes': state.dealerHP = Math.min(INITIAL_HP, state.dealerHP + 1); break;
                          case 'magnifyingGlass': state.shells[state.currentShellIndex].isRevealed = true; break;
                          case 'handSaw': state.sawActive = true; break;
                          case 'handcuffs': state.playerHandcuffed++; break;
                        }
                        
                        render();
                        setTimeout(performDealerAction, 1500); // Re-evaluate after using item
                    }, 1500);
                };

                if (remainingLive === 0) {
                    state.dealerActionMessage = 'Dealer knows the shell is blank, shooting self.';
                    render();
                    setTimeout(() => { state.dealerActionMessage = null; processShot('dealer', 'dealer'); }, 1500);
                    return;
                }
                if (remainingBlank === 0) {
                    const saw = state.dealerInventory.find(i => i.type === 'handSaw');
                    if (saw) { useItem(saw); return; }
                    state.dealerActionMessage = 'Dealer knows it\'s live, shooting you!';
                    render();
                    setTimeout(() => { state.dealerActionMessage = null; processShot('dealer', 'player'); }, 1500);
                    return;
                }

                if (state.dealerHP <= 1 && state.dealerInventory.some(i => i.type === 'cigarettes')) {
                    useItem(state.dealerInventory.find(i => i.type === 'cigarettes'));
                    return;
                }
                if (!currentShell.isRevealed && state.dealerInventory.some(i => i.type === 'magnifyingGlass')) {
                    useItem(state.dealerInventory.find(i => i.type === 'magnifyingGlass'));
                    return;
                }

                if (currentShell.isRevealed) {
                    if (currentShell.type === 'live') {
                        const saw = state.dealerInventory.find(i => i.type === 'handSaw');
                        if (saw) { useItem(saw); return; }
                        state.dealerActionMessage = 'Dealer sees a live shell, shooting you.';
                        render();
                        setTimeout(() => { state.dealerActionMessage = null; processShot('dealer', 'player'); }, 1500);
                        return;
                    } else {
                        state.dealerActionMessage = 'Dealer sees a blank shell, shooting self.';
                        render();
                        setTimeout(() => { state.dealerActionMessage = null; processShot('dealer', 'dealer'); }, 1500);
                        return;
                    }
                }

                const liveChance = remainingLive / remainingTotal;
                const shootTarget = liveChance >= 0.5 ? 'player' : 'dealer';

                state.dealerActionMessage = `Dealer calculates the odds... shooting ${shootTarget === 'player' ? 'you' : 'themselves'}.`;
                render();
                setTimeout(() => {
                    state.dealerActionMessage = null;
                    processShot('dealer', shootTarget);
                }, 2000);

            }, 1000);
        }
        
        function checkForDealerTurn() {
            if (state.currentPlayer === 'dealer' && !state.winner) {
                setTimeout(performDealerAction, 1000);
            }
        }

        // =================================================================
        // 3. UI COMPONENTS (HTML TEMPLATE FUNCTIONS)
        // =================================================================

        const PlayerUI = ({ playerType, hp, inventory, isCurrentTurn, handcuffedTurns }) => {
          const name = playerType === 'player' ? 'You' : 'The Dealer';
          const nameColor = playerType === 'player' ? 'text-blue-400' : 'text-red-400';
          const borderColor = isCurrentTurn ? (playerType === 'player' ? 'border-blue-500' : 'border-red-500') : 'border-gray-700';

          return `
            <div class="bg-gray-800/50 p-3 md:p-4 rounded-xl border-2 transition-all duration-300 ${borderColor}">
              <div class="flex justify-between items-center mb-2">
                <h2 class="text-xl md:text-2xl font-bold ${nameColor}">${name}</h2>
                <div class="flex items-center gap-1">
                  ${Array.from({ length: INITIAL_HP }).map((_, i) =>
                    i < hp ? HeartIcon('w-5 h-5 md:w-6 md:h-6 text-red-500') : SkullIcon('w-5 h-5 md:w-6 md:h-6 text-gray-600')
                  ).join('')}
                </div>
              </div>
              ${handcuffedTurns > 0 ? `
                <div class="mb-2 p-1 bg-yellow-900/50 border border-yellow-500 rounded-md text-center text-yellow-300 font-semibold text-sm">
                  Handcuffed (${handcuffedTurns} turn${handcuffedTurns > 1 ? 's' : ''} left)
                </div>` : ''}
              <div>
                <h3 class="text-base font-semibold mb-1 text-gray-300">Inventory</h3>
                <div class="grid grid-cols-2 gap-2 min-h-[50px]">
                  ${inventory.map(item => `
                    <button
                      data-action="show-item-info"
                      data-item-id="${item.id}"
                      ${playerType === 'dealer' || !isCurrentTurn ? 'disabled' : ''}
                      class="px-2 py-1 rounded-md text-xs md:text-sm transition-all duration-200 bg-gray-700 border-gray-600 border-2 disabled:opacity-50 disabled:cursor-not-allowed hover:enabled:bg-gray-600 hover:enabled:border-gray-400 text-white font-semibold"
                    >
                      ${item.name}
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>`;
        };

        const GameLog = ({ logs }) => {
          const logColors = { player: 'text-blue-300', dealer: 'text-red-300', game: 'text-gray-400' };
          return `
            <div class="bg-gray-900/70 p-2 rounded-xl border-2 border-gray-700 h-full overflow-y-auto">
              <h3 class="text-lg font-bold text-center text-gray-300 sticky top-0 bg-gray-900/80 backdrop-blur-sm py-1 z-10 -mt-2 pt-2">Game Log</h3>
              <div class="flex flex-col gap-1 text-sm pt-1">
                ${logs.map(log => `<p class="${logColors[log.type]}">${log.message}</p>`).join('')}
              </div>
            </div>`;
        };
        
        const GameOverModal = ({ winner }) => {
            if (!winner) return '';
            const isPlayerWinner = winner === 'player';
            return `
                <div class="fixed inset-0 bg-black/80 flex justify-center items-center z-50">
                  <div class="p-8 rounded-xl border-4 ${isPlayerWinner ? 'border-green-500' : 'border-red-500'} bg-gray-800 text-center animate-fade-in">
                    <h2 class="text-5xl font-bold mb-4 ${isPlayerWinner ? 'text-green-400' : 'text-red-400'}">
                      ${isPlayerWinner ? 'You Win!' : 'You Lose!'}
                    </h2>
                    <p class="text-xl mb-6 text-gray-300">
                      ${isPlayerWinner ? 'You have outsmarted the dealer.' : 'The dealer claims another victim.'}
                    </p>
                    <button data-action="restart" class="px-8 py-3 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition-colors">
                      Play Again
                    </button>
                  </div>
                </div>`;
        };

        const ItemConfirmationModal = ({ item }) => {
            if (!item) return '';
            return `
                <div class="fixed inset-0 bg-black/80 flex justify-center items-center z-50" data-action="cancel-item">
                    <div class="bg-gray-800 p-8 rounded-xl border-4 border-yellow-500 text-center max-w-sm">
                        <h2 class="text-3xl font-bold text-yellow-300 mb-2">${item.name}</h2>
                        <p class="text-lg text-gray-300 mb-6">${item.description}</p>
                        <div class="flex justify-center gap-4">
                            <button data-action="cancel-item" class="px-6 py-2 bg-gray-600 text-white font-bold rounded-lg hover:bg-gray-700 transition-colors">
                                Cancel
                            </button>
                            <button data-action="confirm-item" data-item-id="${item.id}" class="px-6 py-2 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700 transition-colors">
                                Use Item
                            </button>
                        </div>
                    </div>
                </div>`;
        };

        // =================================================================
        // 4. MAIN RENDER FUNCTION & EVENT HANDLING
        // =================================================================
        
        function render() {
            const root = document.getElementById('root');
            const { 
                round, playerHP, dealerHP, shells, currentShellIndex, playerInventory, dealerInventory, 
                currentPlayer, playerHandcuffed, dealerHandcuffed, logs, winner, initialShellCounts, 
                dealerActionMessage, itemToConfirm, gameMode, lastActionMessage
            } = state;
            
            root.innerHTML = `
                <div class="bg-gradient-to-br from-gray-900 via-black to-gray-800 text-white h-screen flex flex-col items-center p-2 sm:p-4 antialiased">
                  ${GameOverModal({ winner })}
                  ${ItemConfirmationModal({ item: itemToConfirm })}
                  
                  <div class="w-full max-w-5xl mx-auto flex flex-col h-full space-y-2">
                    <header class="flex justify-between items-center shrink-0">
                        <div class="flex-1 flex justify-start">
                            <button data-action="toggle-mode" class="p-2 text-gray-400 hover:text-white transition-colors text-sm font-semibold rounded-lg bg-gray-800 border-2 border-gray-600 whitespace-nowrap">
                                Mode: <span class="${gameMode === 'testing' ? 'text-yellow-400' : 'text-green-400'}">
                                    ${gameMode === 'testing' ? 'Testing' : 'Live'}
                                </span>
                            </button>
                        </div>
                        <h1 class="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold text-red-600 tracking-wider text-center px-2 sm:px-4 whitespace-nowrap">Buckshot Roulette</h1>
                        <div class="flex-1 flex justify-end">
                            <!-- Sound button removed -->
                        </div>
                    </header>
                    
                    ${gameMode !== 'live' ? `
                    <div class="text-center shrink-0">
                        <p class="text-lg font-bold text-gray-300">
                            Round ${round}: <span class="font-semibold text-red-500">${initialShellCounts.live} Live</span>, <span class="font-semibold text-blue-400">${initialShellCounts.blank} Blank</span>
                        </p>
                    </div>
                    ` : ''}

                    <div class="flex justify-center items-center flex-wrap gap-2 md:gap-3 my-1 min-h-[4rem] shrink-0">
                        ${shells.map((shell, index) => {
                            const isFired = index < currentShellIndex;
                            if (gameMode === 'live' && isFired) return '';
                            let displayType = 'unknown';
                            if (shell.isRevealed || (gameMode === 'testing' && isFired)) {
                                displayType = shell.type;
                            }
                            return ShellIcon({ type: displayType, isFired: gameMode === 'testing' && isFired });
                        }).join('')}
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-2 md:gap-4 shrink-0">
                      ${PlayerUI({ playerType: "player", hp: playerHP, inventory: playerInventory, isCurrentTurn: currentPlayer === 'player', handcuffedTurns: playerHandcuffed })}
                      ${PlayerUI({ playerType: "dealer", hp: dealerHP, inventory: dealerInventory, isCurrentTurn: currentPlayer === 'dealer', handcuffedTurns: dealerHandcuffed })}
                    </div>

                    <div class="bg-gray-800/50 p-3 rounded-xl border-2 border-gray-700 shrink-0">
                      <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <button
                            data-action="shoot-dealer"
                            ${currentPlayer !== 'player' || winner !== null ? 'disabled' : ''}
                            class="w-full py-2 px-4 bg-red-800/80 border-2 border-red-600 rounded-lg font-bold transition-all duration-200 hover:enabled:bg-red-700/90 hover:enabled:border-red-500 hover:enabled:-translate-y-0.5 disabled:opacity-40 disabled:cursor-not-allowed"
                        >
                          Shoot Dealer
                        </button>
                        <button
                            data-action="shoot-self"
                            ${currentPlayer !== 'player' || winner !== null ? 'disabled' : ''}
                            class="w-full py-2 px-4 bg-gray-700 border-2 border-gray-500 rounded-lg font-bold transition-all duration-200 hover:enabled:bg-gray-600 hover:enabled:border-gray-400 hover:enabled:-translate-y-0.5 disabled:opacity-40 disabled:cursor-not-allowed"
                        >
                          Shoot Self
                        </button>
                      </div>
                      ${dealerActionMessage ? `<p class="text-center mt-2 text-yellow-300 italic animate-pulse text-sm">${dealerActionMessage}</p>` : ''}
                    </div>
                    
                    <div class="flex-grow min-h-0 h-28">
                        ${gameMode === 'testing'
                            ? GameLog({ logs })
                            : `<div class="w-full h-full flex flex-col items-center justify-center p-2 text-center bg-gray-900/70 rounded-xl border-2 border-gray-700 animate-fade-in">
                                <h4 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Last Action</h4>
                                <p class="text-xl font-semibold ${lastActionMessage.type === 'player' ? 'text-blue-300' : lastActionMessage.type === 'dealer' ? 'text-red-300' : 'text-gray-300'}">
                                    ${lastActionMessage.message || 'Waiting for action...'}
                                </p>
                            </div>`
                        }
                    </div>
                  </div>
                </div>
            `;
        }

        document.getElementById('root').addEventListener('click', (e) => {
            let target = e.target;
            let actionTarget = target.closest('[data-action]');
            
            if (!actionTarget) return;

            const action = actionTarget.dataset.action;
            const itemId = actionTarget.dataset.itemId;
            
            // Prevent modal from closing when clicking inside it
            if (action === 'cancel-item' && actionTarget === e.target && e.target.classList.contains('bg-black/80')) {
                 state.itemToConfirm = null;
                 render();
                 return;
            } else if (action === 'cancel-item') {
                 state.itemToConfirm = null;
                 render();
                 return;
            }

            if (state.currentPlayer !== 'player' && !['toggle-mode', 'restart'].includes(action)) {
                return;
            }

            switch (action) {
                case 'restart':
                    resetState();
                    startNewRound(1);
                    render();
                    break;
                case 'shoot-dealer':
                    processShot('player', 'dealer');
                    break;
                case 'shoot-self':
                    processShot('player', 'player');
                    break;
                case 'show-item-info':
                    const itemToShow = state.playerInventory.find(i => i.id == itemId);
                    if (itemToShow) {
                        state.itemToConfirm = itemToShow;
                        render();
                    }
                    break;
                case 'confirm-item':
                    const itemToUse = state.playerInventory.find(i => i.id == itemId);
                    if (itemToUse) {
                        addLog(`You use ${itemToUse.name}.`, 'player');
                        setLastAction(`You used ${itemToUse.name}`, 'player');
                        state.itemToConfirm = null;

                        switch (itemToUse.type) {
                            case 'magnifyingGlass':
                                const shellToReveal = state.shells[state.currentShellIndex];
                                if (shellToReveal) {
                                    shellToReveal.isRevealed = true;
                                    addLog(`The next shell is a ${shellToReveal.type.toUpperCase()}.`, 'game');
                                    setLastAction(`Next shell is: ${shellToReveal.type.toUpperCase()}`, 'game');
                                }
                                break;
                            case 'handSaw':
                                state.sawActive = true;
                                addLog('The next live shell will deal double damage.', 'game');
                                break;
                            case 'beer':
                                const ejectedShell = state.shells[state.currentShellIndex];
                                if (ejectedShell) {
                                    addLog(`The ejected shell was ${ejectedShell.type.toUpperCase()}.`, 'game');
                                    setLastAction(`Ejected shell was ${ejectedShell.type.toUpperCase()}`, 'game');
                                    state.currentShellIndex++;
                                    if (state.currentShellIndex >= state.shells.length) {
                                        setTimeout(() => {
                                            state.round++;
                                            addLog("Gun is empty. Reloading...", 'game');
                                            setLastAction("Gun is empty. Reloading...", 'game');
                                            startNewRound(state.round);
                                            state.currentPlayer = 'player';
                                            render();
                                        }, 1500);
                                    }
                                }
                                break;
                            case 'handcuffs':
                                state.dealerHandcuffed++;
                                addLog('The dealer will skip their next turn.', 'game');
                                break;
                            case 'cigarettes':
                                state.playerHP = Math.min(INITIAL_HP, state.playerHP + 1);
                                addLog('You restored 1 HP.', 'player');
                                break;
                        }

                        state.playerInventory = state.playerInventory.filter(i => i.id !== itemToUse.id);
                        render();
                        checkForDealerTurn();
                    }
                    break;
                case 'toggle-mode':
                    state.gameMode = state.gameMode === 'testing' ? 'live' : 'testing';
                    render();
                    break;
            }
        });

        // =================================================================
        // 5. INITIALIZE GAME
        // =================================================================
        
        document.addEventListener('DOMContentLoaded', () => {
            resetState();
            startNewRound(1);
            render();
        });

        // --- END OF INLINED SCRIPT ---
    </script>
</body>
</html>
